<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Causal signal and execution timeline</title><desc id="desc">Features and model use information available by the signal close at T. Portfolio execution occurs at the next session open T plus one.</desc><rect width="1200" height="330" fill="#ffffff"/>
  <style>.txt{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:600}.sub{font-size:14px;fill:#475569}.line{stroke:#334155;stroke-width:3}.tick{stroke:#334155;stroke-width:2}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2;rx:10}.green{fill:#dcfce7;stroke:#15803d;stroke-width:2;rx:10}.gray{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:10}</style>
  <text x="55" y="48" class="txt title">Causal research timeline</text><line x1="110" y1="175" x2="1090" y2="175" class="line"/><line x1="290" y1="160" x2="290" y2="190" class="tick"/><line x1="650" y1="150" x2="650" y2="200" class="tick"/><line x1="850" y1="150" x2="850" y2="200" class="tick"/>
  <text x="290" y="215" class="txt label" text-anchor="middle">Historical window</text><text x="650" y="215" class="txt label" text-anchor="middle">T close</text><text x="850" y="215" class="txt label" text-anchor="middle">T+1 open</text>
  <rect x="120" y="85" width="430" height="58" class="gray"/><text x="335" y="110" class="txt label" text-anchor="middle">Training observations</text><text x="335" y="132" class="txt sub" text-anchor="middle">labels must be fully observable by T</text>
  <rect x="570" y="85" width="160" height="58" class="blue"/><text x="650" y="110" class="txt label" text-anchor="middle">Signal</text><text x="650" y="132" class="txt sub" text-anchor="middle">rank after close</text>
  <rect x="770" y="85" width="160" height="58" class="green"/><text x="850" y="110" class="txt label" text-anchor="middle">Execution</text><text x="850" y="132" class="txt sub" text-anchor="middle">next-session open</text>
  <rect x="965" y="85" width="150" height="58" class="gray"/><text x="1040" y="110" class="txt label" text-anchor="middle">Hold</text><text x="1040" y="132" class="txt sub" text-anchor="middle">mark to market</text>
  <text x="110" y="280" class="txt sub">No feature uses observations after its timestamp. No signal can execute on the same close used to compute it.</text>
</svg>
