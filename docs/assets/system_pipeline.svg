<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Vietnam Equity Quant Lab research pipeline</title>
  <desc id="desc">Market data flows through validation, feature engineering, model fitting, ranking, portfolio construction, execution-aware backtesting, and forward monitoring.</desc>
  <rect width="1400" height="360" fill="#ffffff"/>
  <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}.core{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:12}.txt{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#0f172a;font-weight:600}.sub{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#475569}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <text x="55" y="45" class="txt" style="font-size:24px">Research and execution pipeline</text>
  <g transform="translate(40,95)"><rect class="box" x="0" y="0" width="150" height="110"/><text class="txt" x="75" y="39" text-anchor="middle">Market data</text><text class="sub" x="75" y="66" text-anchor="middle">OHLCV schema</text><text class="sub" x="75" y="86" text-anchor="middle">provider adapters</text></g>
  <path class="arrow" d="M195 150 H245"/>
  <g transform="translate(250,95)"><rect class="box" x="0" y="0" width="160" height="110"/><text class="txt" x="80" y="39" text-anchor="middle">Validation</text><text class="sub" x="80" y="66" text-anchor="middle">duplicates</text><text class="sub" x="80" y="86" text-anchor="middle">price consistency</text></g>
  <path class="arrow" d="M415 150 H465"/>
  <g transform="translate(470,95)"><rect class="core" x="0" y="0" width="170" height="110"/><text class="txt" x="85" y="39" text-anchor="middle">Features</text><text class="sub" x="85" y="66" text-anchor="middle">momentum</text><text class="sub" x="85" y="86" text-anchor="middle">volatility · price state</text></g>
  <path class="arrow" d="M645 150 H695"/>
  <g transform="translate(700,95)"><rect class="core" x="0" y="0" width="170" height="110"/><text class="txt" x="85" y="39" text-anchor="middle">Model</text><text class="sub" x="85" y="66" text-anchor="middle">walk-forward fit</text><text class="sub" x="85" y="86" text-anchor="middle">cross-sectional score</text></g>
  <path class="arrow" d="M875 150 H925"/>
  <g transform="translate(930,95)"><rect class="box" x="0" y="0" width="170" height="110"/><text class="txt" x="85" y="39" text-anchor="middle">Portfolio</text><text class="sub" x="85" y="66" text-anchor="middle">rank · top-k</text><text class="sub" x="85" y="86" text-anchor="middle">target weights</text></g>
  <path class="arrow" d="M1105 150 H1155"/>
  <g transform="translate(1160,95)"><rect class="core" x="0" y="0" width="190" height="110"/><text class="txt" x="95" y="39" text-anchor="middle">Backtest</text><text class="sub" x="95" y="66" text-anchor="middle">next-session open</text><text class="sub" x="95" y="86" text-anchor="middle">costs · lot size · NAV</text></g>
  <path class="arrow" d="M1255 215 V270 H1045"/>
  <g transform="translate(785,250)"><rect class="box" x="0" y="0" width="250" height="70"/><text class="txt" x="125" y="30" text-anchor="middle">Forward monitoring</text><text class="sub" x="125" y="52" text-anchor="middle">freshness gates · decision evidence</text></g>
</svg>
